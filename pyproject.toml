[project]
name = "llm"
version = "0.1.0"
description = "Local package imported from notebooks"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "kagglehub>=1.0.3",
    "pydantic>=2.14.3",
]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
